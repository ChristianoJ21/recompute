<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-rc-root="" style="container-type:inline-size;background-color:var(--rc-page,#F4F4F1);background-image:linear-gradient(var(--rc-grid,#E6E6DF) 1px,transparent 1px),linear-gradient(90deg,var(--rc-grid,#E6E6DF) 1px,transparent 1px);background-size:24px 24px;color:var(--rc-ink,#0E1116);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:760px">
  <dc-import name="RC Header" theme="{{ theme }}" menu-open="{{ menuOpen }}" active="login" hint-size="100%,100px"></dc-import>
  <main style="flex:1;width:100%;max-width:440px;margin:0 auto;padding:clamp(32px,6cqi,72px) 16px 64px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rc-accent,#2443C9)">/ Login</span>
      <h1 style="margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1">Technician login</h1>
      <p style="margin:0;font-size:15px;color:var(--rc-ink-2,#4A4F57);text-wrap:pretty">Reading passports needs no login. There is no sign-up: an admin or a colleague creates your account.</p>
    </div>
    <form style="background:var(--rc-surface,#FFFFFF);border:1px solid var(--rc-line,#D6D6CF);box-shadow:var(--rc-shadow,0 1px 2px rgba(14,17,22,.06),0 10px 28px -14px rgba(14,17,22,.22));padding:20px;display:flex;flex-direction:column;gap:16px">
      <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--rc-danger-bg,#FBE9E7);border:1px solid var(--rc-danger-line,#EBA8A1);color:var(--rc-danger-ink,#7A1A14);font-size:14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none;margin-top:2px"><rect width="16" height="16" rx="2" style="fill:var(--rc-danger,#B3261E)"></rect><path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" stroke-width="1.9" style="stroke:var(--rc-surface,#FFFFFF)"></path></svg><span><strong>Wrong username or password.</strong> Check both and try again.</span></div>
      </sc-if>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Username<input value="t.one" autocomplete="username" style="font:inherit;font-size:16px;font-weight:400;min-height:44px;padding:0 12px;border:1px solid {{ bd }};border-radius:2px;background:var(--rc-surface,#FFFFFF);color:var(--rc-ink,#0E1116);font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Password<input type="password" value="samplepass" autocomplete="current-password" style="font:inherit;font-size:16px;font-weight:400;min-height:44px;padding:0 12px;border:1px solid {{ bd }};border-radius:2px;background:var(--rc-surface,#FFFFFF);color:var(--rc-ink,#0E1116)"></input></label>
      <button type="submit" style="min-height:48px;border-radius:2px;background:var(--rc-ink,#0E1116);color:var(--rc-surface,#FFFFFF);border:1px solid var(--rc-ink,#0E1116);font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--rc-accent,#2443C9)" style-active="transform:none;box-shadow:none">Log in</button>
    </form>
    <a href="/" style="font-size:14px;color:var(--rc-accent,#2443C9);font-weight:600;text-underline-offset:3px;align-self:flex-start;min-height:44px;display:inline-flex;align-items:center">← Back to available hardware</a>
  </main>
  <dc-import name="RC Footer" hint-size="100%,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;error&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { ...this._rv(), theme: this.props.theme, menuOpen: this.props.menuOpen }; }
  _rv() {
    const error = !!this.props.error;
    return { error, bd: error ? 'var(--rc-danger,#B3261E)' : 'var(--rc-line-strong,#A9A9A0)' };
  }
}
</script>
</body>
</html>
