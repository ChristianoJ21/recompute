<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1F7F2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E1116'/%3E%3Crect x='5' y='11' width='9' height='10' fill='none' stroke='white' stroke-width='2'/%3E%3Crect x='17' y='10' width='10' height='12' fill='%238EA2FF'/%3E%3C/svg%3E"
    />
    <title>ReCompute · sample data demo</title>
    <script>
      // Same rule as src/lib/theme.ts, run before the first paint so the page never flashes the wrong theme.
      ;(function () {
        var theme = 'light'
        try {
          theme = localStorage.getItem('rc-theme') || 'light'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
