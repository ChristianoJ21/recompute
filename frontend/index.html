<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1F7F2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='15' y='2.5' width='2.6' height='7' rx='1' fill='%235E9A73'/%3E%3Ccircle cx='16.3' cy='2.8' r='1.9' fill='%23E2B04A'/%3E%3Crect x='3.5' y='8' width='25' height='21' rx='5.5' fill='%23A3B2AB'/%3E%3Crect x='6.5' y='11' width='19' height='15' rx='3' fill='%2323443A'/%3E%3Crect x='9' y='14.2' width='5.2' height='5.2' rx='1.3' fill='%23F8EFDD'/%3E%3Crect x='17.6' y='14.6' width='4.6' height='4.6' rx='2.3' fill='%23E2B04A'/%3E%3Cpath d='M12.4 22.4q3.6 2.4 7.2 0' stroke='%239CC9A9' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>ReCompute · sample data demo</title>
    <script>
      // Same rule as src/lib/theme.ts, run before the first paint so the page never flashes the wrong theme.
      ;(function () {
        var theme = 'light'
        try {
          theme = localStorage.getItem('rc-theme') || 'light'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
